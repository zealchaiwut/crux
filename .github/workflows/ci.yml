name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  conflict-markers:
    name: No merge-conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any tracked file contains conflict markers
        run: |
          if git grep -rn '^<<<<<<< \|^=======$\|^>>>>>>> ' -- ':!*.pyc'; then
            echo "ERROR: merge-conflict markers found in tracked files (see above)"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: conflict-markers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: make test
